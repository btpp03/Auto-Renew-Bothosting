name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (日本 socks5 → 本地无认证 socks5:1080)
        # 用户指定日本 socks 代理。Chrome 无法直接挂带认证的远程 socks（会连接失败显示离线页），
        # 因此用 sing-box 把远程认证 socks 转发成本地 127.0.0.1:1080 无认证 socks，再让 app.py 挂载。
        run: |
          wget -qO sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.7/sing-box-1.13.7-linux-amd64.tar.gz
          tar -xzf sb.tar.gz && mv sing-box-*/sing-box ./ && chmod +x sing-box && rm -f sb.tar.gz
          cat > sing-box-config.json <<'EOF'
          {
            "log": {"level": "warn"},
            "inbounds": [{"type":"socks","tag":"socks-in","listen":"127.0.0.1","listen_port":1080}],
            "outbounds": [{
              "type":"socks","tag":"jp-socks",
              "server":"162.43.43.134","server_port":25575,
              "version":"5",
              "username":"97cec60d-8b80-4c99-ab58-cb7da426ea35",
              "password":"97cec60d-8b80-4c99-ab58-cb7da426ea35"
            }]
          }
          EOF
          ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
          sleep 3
          echo "IS_PROXY=true" >> $GITHUB_ENV
          echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV
          echo "=== 验证本地 socks 出口 IP ==="
          curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org || echo "(验证失败,看 sing-box.log)"
          echo ""
          echo "✅ 日本 socks 已转发到本地 127.0.0.1:1080"

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 📸 上传续期诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-result-${{ github.run_number }}
          path: |
            renew_result.png
            renew_before_submit.png
            renew_after_submit.png
            renew_result.html
            debug_dom/
          if-no-files-found: warn
          retention-days: 7

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
